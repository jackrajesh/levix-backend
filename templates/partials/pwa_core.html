{# PWA core — include on every page (marketing, auth, dashboard). No permissions required for install. #}
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LEVIX">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" sizes="180x180" href="/static/icons/icon-180.png">
<link rel="apple-touch-icon" sizes="192x192" href="/static/icons/icon-192.png">
<script>
(() => {
  if (!("serviceWorker" in navigator)) return;
  window.__levixSwReady = navigator.serviceWorker
    .register("/sw.js", { scope: "/", updateViaCache: "none" })
    .then(async (registration) => {
      if (registration.waiting) {
        registration.waiting.postMessage({ type: "SKIP_WAITING" });
      }
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(
        regs.map((reg) => {
          if (reg !== registration && (reg.scope || "").includes("/static/")) {
            return reg.unregister();
          }
          return Promise.resolve();
        })
      );
      return registration;
    })
    .catch(() => null);
})();
</script>
