<!DOCTYPE html>
<html lang="en-IN" data-theme="light">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MC7H8XFN47"></script>

      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

    {% include 'partials/pwa_core.html' %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Shop – LEVIX</title>
    <meta name="description" content="Join LEVIX and start managing your shop's orders, inventory, and customers with ease. Built for Indian local businesses.">
    <link rel="icon" type="image/png" href="/static/favicon.png?v=20260529">
    <script src="/static/pwa-install.js?v=20260529" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Theme system (dark/light mode prep) -->
    <script src="/static/theme.js"></script>
    <!-- Multilingual architecture prep -->
    <script src="/static/i18n.js" defer></script>
    <style>
        :root {
            --primary: #1a56db;
            --primary-hover: #1648b8;
            --bg: #f8fafc;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text: #1e293b;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            -webkit-font-smoothing: antialiased;
        }

        .register-card {
            background: var(--surface);
            width: 100%;
            max-width: 480px;
            padding: 40px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .logo-wrapper {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-brand{display:inline-flex;align-items:baseline;gap:0;text-decoration:none;font-family:'Inter',system-ui,sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:-0.05em;font-size:1.5rem;}
        .logo-light{color:#0f172a;}
        .logo-dark{color:#ffffff;}
        .logo-x{color:#2563eb;font-weight:900;}

        .card-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .card-header h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .card-header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            color: var(--text);
            outline: none;
            transition: all 0.2s;
        }

        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26, 86, 219, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .status-msg {
            margin-top: 24px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            display: none;
        }

        .status-error { background: #fef2f2; border: 1px solid #fee2e2; color: #991b1b; }
        .status-success { background: #f0fdf4; border: 1px solid #dcfce7; color: #166534; }

        .card-footer {
            margin-top: 32px;
            text-align: center;
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        .card-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .card-footer a:hover {
            text-decoration: underline;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading .spinner { display: block; }
        .loading .btn-text { display: none; }

        @media (max-width: 480px) {
            .register-card {
                padding: 30px 20px;
                box-shadow: none;
                border: none;
                background: transparent;
            }
            body { background: var(--surface); padding-top: 20px; }
        }
    </style>
</head>
<body>

<script>
    // --- AUTH GUARD ---
    if (localStorage.getItem('token')) {
        console.log("[AUTH] Token found, auto-redirecting to dashboard...");
        window.location.href = '/dashboard';
    }
</script>

<div class="register-card">
    <div class="logo-wrapper">
        <a href="/" class="logo-brand logo-light"><span class="logo-text">LEVI</span><span class="logo-x">X</span></a>
    </div>

    <div class="card-header">
        <h1>Create Your Shop</h1>
        <p>Start managing your business today</p>
    </div>

    <form id="register-form">
        <div class="form-group">
            <label class="form-label" for="shop_name">Shop Name</label>
            <input type="text" id="shop_name" class="form-input" placeholder="e.g. Rahul Kirana Store" required maxlength="100">
        </div>

        <div class="form-group">
            <label class="form-label" for="owner_name">Owner Name</label>
            <input type="text" id="owner_name" class="form-input" placeholder="Your full name" required maxlength="100">
        </div>

        <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" id="email" class="form-input" placeholder="you@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
            <label class="form-label" for="phone_number">Mobile Number</label>
            <input type="tel" id="phone_number" class="form-input" placeholder="10-digit mobile number" required autocomplete="tel" maxlength="10" pattern="[0-9]{10}" inputmode="numeric">
        </div>

        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" class="form-input" placeholder="Create a strong password" required autocomplete="new-password" minlength="8">
        </div>

        <button type="submit" class="btn-submit" id="submit-btn">
            <span class="spinner"></span>
            <span class="btn-text">Register My Shop</span>
        </button>

        <div id="status-msg" class="status-msg"></div>
    </form>

    <div class="card-footer">
        Already have an account? <a href="/login">Sign In</a>
    </div>
</div>

<script>
    const form = document.getElementById('register-form');
    const submitBtn = document.getElementById('submit-btn');
    const statusMsg = document.getElementById('status-msg');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const shop_name = document.getElementById('shop_name').value.trim();
        const owner_name = document.getElementById('owner_name').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone_number = document.getElementById('phone_number').value.trim();
        const password = document.getElementById('password').value;

        // Client-side phone validation
        if (!/^[0-9]{10}$/.test(phone_number)) {
            statusMsg.textContent = 'Please enter a valid 10-digit mobile number.';
            statusMsg.className = 'status-msg status-error';
            statusMsg.style.display = 'block';
            return;
        }

        // Reset state
        statusMsg.style.display = 'none';
        statusMsg.className = 'status-msg';
        submitBtn.classList.add('loading');
        submitBtn.disabled = true;

        try {
            const response = await fetch('/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    shop_name,
                    owner_name,
                    email,
                    phone_number,
                    password
                })
            });

            const data = await response.json();

            if (response.ok) {
                statusMsg.textContent = 'Account created successfully! Redirecting...';
                statusMsg.className = 'status-msg status-success';
                statusMsg.style.display = 'block';
                
                // Optional: Auto-login or redirect
                setTimeout(() => {
                    window.location.href = '/login?registered=true';
                }, 1500);
            } else {
                throw new Error(data.detail || data.message || 'Registration failed');
            }
        } catch (err) {
            statusMsg.textContent = err.message;
            statusMsg.className = 'status-msg status-error';
            statusMsg.style.display = 'block';
            submitBtn.classList.remove('loading');
            submitBtn.disabled = false;
        }
    });
</script>

</body>
</html>
