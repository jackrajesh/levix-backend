<!DOCTYPE html>
<html lang="en-IN" data-theme="light">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MC7H8XFN47"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-MC7H8XFN47');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a56db">
    <title>Sign In – LEVIX</title>
    <meta name="description" content="Sign in to your LEVIX account to manage your shop's orders, inventory, and customers.">
    <link rel="icon" type="image/png" href="/static/favicon.png?v=20260528b">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Theme system (dark/light mode prep) -->
    <script src="/static/theme.js"></script>
    <!-- Multilingual architecture prep -->
    <script src="/static/i18n.js" defer></script>
    <style>
        :root {
            --primary: #1a56db;
            --primary-hover: #1648b8;
            --bg: #f8fafc;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text: #1e293b;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        .login-card {
            background: var(--surface);
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .logo-wrapper {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-brand{display:inline-flex;align-items:baseline;gap:0;text-decoration:none;font-family:'Inter',system-ui,sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:-0.05em;font-size:1.5rem;}
        .logo-light{color:#0f172a;}
        .logo-dark{color:#ffffff;}
        .logo-x{color:#2563eb;font-weight:900;}

        .card-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .card-header h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .card-header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            color: var(--text);
            outline: none;
            transition: all 0.2s;
        }

        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26, 86, 219, 0.1);
        }

        .forgot-link {
            display: block;
            text-align: right;
            font-size: 0.875rem;
            color: var(--primary);
            text-decoration: none;
            margin-top: 8px;
            font-weight: 500;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .status-msg {
            margin-top: 20px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            display: none;
        }

        .status-error {
            background: #fef2f2;
            border: 1px solid #fee2e2;
            color: #991b1b;
        }

        .card-footer {
            margin-top: 32px;
            text-align: center;
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        .card-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .card-footer a:hover {
            text-decoration: underline;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading .spinner { display: block; }
        .loading .btn-text { display: none; }

        @media (max-width: 480px) {
            .login-card {
                padding: 30px 20px;
                box-shadow: none;
                border: none;
                background: transparent;
            }
            body {
                background: var(--surface);
            }
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo-wrapper">
        <a href="/" class="logo-brand logo-light"><span class="logo-text">LEVI</span><span class="logo-x">X</span></a>
    </div>

    <div class="card-header">
        <h1>Welcome Back</h1>
        <p>Sign in to manage your shop</p>
    </div>

    <form id="login-form">
        <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" id="email" class="form-input" placeholder="you@example.com" required autocomplete="email">
        </div>
        
        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" class="form-input" placeholder="Password" required autocomplete="current-password">
            <a href="/forgot-password" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="btn-submit" id="submit-btn">
            <span class="spinner"></span>
            <span class="btn-text">Sign In</span>
        </button>

        <div id="status-msg" class="status-msg status-error"></div>
    </form>

    <div class="card-footer">
        Don't have a shop yet? <a href="/register">Create Account</a>
    </div>
</div>

<script>
    // --- AUTH GUARD ---
    if (localStorage.getItem('token')) {
        console.log("[AUTH] Token found, auto-redirecting to dashboard...");
        window.location.href = '/dashboard';
    }

    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');
    const statusMsg = document.getElementById('status-msg');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        // Reset state
        statusMsg.style.display = 'none';
        submitBtn.classList.add('loading');
        submitBtn.disabled = true;

        try {
            const formData = new URLSearchParams();
            formData.append('username', email);
            formData.append('password', password);

            const response = await fetch('/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: formData
            });

            const data = await response.json();

            if (response.ok) {
                // Success - Save token and redirect
                console.log("[AUTH] Login successful, saving token...");
                localStorage.setItem('token', data.access_token);
                
                // Small delay to ensure localStorage write is complete in some browsers
                setTimeout(() => {
                    console.log("[AUTH] Redirecting to /dashboard");
                    window.location.href = '/dashboard';
                }, 50);
            } else {
                throw new Error(data.detail || 'Invalid email or password');
            }
        } catch (err) {
            statusMsg.textContent = err.message;
            statusMsg.style.display = 'block';
            submitBtn.classList.remove('loading');
            submitBtn.disabled = false;
        }
    });
</script>

</body>
</html>
