<!DOCTYPE html>
<html lang="en-IN" data-theme="light">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MC7H8XFN47"></script>

      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

    {% include 'partials/pwa_core.html' %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password – LEVIX</title>
    <meta name="description" content="Enter your OTP and set a new password for your Levix account.">
    <link rel="icon" type="image/png" href="/static/favicon.png?v=20260529">
    <script src="/static/pwa-install.js?v=20260530" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Theme system (dark/light mode prep) -->
    <script src="/static/theme.js"></script>
    <!-- Multilingual architecture prep -->
    <script src="/static/i18n.js" defer></script>
    <style>
        :root {
            --primary: #1a56db;
            --primary-hover: #1648b8;
            --bg: #f8fafc;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text: #1e293b;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        .reset-card {
            background: var(--surface);
            width: 100%;
            max-width: 440px;
            padding: 40px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .logo-wrapper {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-brand{display:flex;align-items:baseline;gap:0;text-decoration:none;font-family:'Inter',system-ui,sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:-0.05em;font-size:1.5rem;justify-content:center;margin-bottom:32px;}
        .logo-light{color:#0f172a;}
        .logo-dark{color:#ffffff;}
        .logo-x{color:#2563eb;font-weight:900;}

        .card-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .card-header h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .card-header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            color: var(--text);
            outline: none;
            transition: all 0.2s;
        }

        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26, 86, 219, 0.1);
        }

        .otp-input {
            text-align: center;
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 0.5rem;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-submit:hover { background: var(--primary-hover); }
        .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; }

        .resend-container {
            display: flex;
            justify-content: flex-end;
            margin-top: 8px;
        }

        #resend-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-size: 0.8125rem;
            font-weight: 600;
            cursor: pointer;
            padding: 4px;
        }

        #resend-timer {
            color: var(--text-muted);
            font-size: 0.8125rem;
            padding: 4px;
        }

        .status-msg {
            margin-top: 24px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            display: none;
            text-align: center;
        }

        .status-error { background: #fef2f2; border: 1px solid #fee2e2; color: #991b1b; }
        .status-success { background: #f0fdf4; border: 1px solid #dcfce7; color: #166534; }

        .card-footer {
            margin-top: 32px;
            text-align: center;
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        .card-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .card-footer a:hover { text-decoration: underline; }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        .loading .spinner { display: block; }
        .loading .btn-text { display: none; }

        @media (max-width: 480px) {
            .reset-card {
                padding: 30px 20px;
                box-shadow: none;
                border: none;
                background: transparent;
            }
            body { background: var(--surface); }
        }
    </style>
</head>
<body>

<div class="reset-card">
    <div class="logo-wrapper">
        <a href="/" class="logo-brand logo-light">
            <span class="logo-text">LEVI</span><span class="logo-x">X</span>
        </a>
    </div>

    <div class="card-header">
        <h1>New Password</h1>
        <p>Enter the OTP sent to your email and choose a new password.</p>
    </div>

    <form id="reset-form">
        <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" id="email" class="form-input" required readonly autocomplete="email">
        </div>

        <div class="form-group">
            <label class="form-label" for="otp">6-Digit OTP</label>
            <input type="text" id="otp" class="form-input otp-input" placeholder="Enter 6-digit OTP" required maxlength="6" pattern="\d{6}" inputmode="numeric">
            <div class="resend-container">
                <button type="button" id="resend-btn">Resend OTP</button>
                <span id="resend-timer" style="display:none;"></span>
            </div>
        </div>
        
        <div class="form-group">
            <label class="form-label" for="password">New Password</label>
            <input type="password" id="password" class="form-input" placeholder="Min. 8 characters" required minlength="8" autocomplete="new-password">
        </div>

        <button type="submit" class="btn-submit" id="submit-btn">
            <span class="spinner"></span>
            <span class="btn-text">Reset Password</span>
        </button>

        <div id="status-msg" class="status-msg"></div>
    </form>

    <div class="card-footer">
        <a href="/login">Back to Login</a>
    </div>
</div>

<script>
    const form = document.getElementById('reset-form');
    const submitBtn = document.getElementById('submit-btn');
    const statusMsg = document.getElementById('status-msg');
    const resendBtn = document.getElementById('resend-btn');
    const resendTimer = document.getElementById('resend-timer');

    // Auto-fill email from URL
    const urlParams = new URLSearchParams(window.location.search);
    const emailParam = urlParams.get('email');
    if (emailParam) {
        document.getElementById('email').value = emailParam;
    }

    // OTP numeric only
    document.getElementById('otp').addEventListener('input', function() {
        this.value = this.value.replace(/\D/g, '');
    });

    let cooldown = 0;
    function startCooldown(seconds) {
        cooldown = seconds;
        resendBtn.style.display = 'none';
        resendTimer.style.display = 'block';
        const interval = setInterval(() => {
            cooldown--;
            resendTimer.textContent = `Resend in ${cooldown}s`;
            if (cooldown <= 0) {
                clearInterval(interval);
                resendBtn.style.display = 'block';
                resendTimer.style.display = 'none';
            }
        }, 1000);
    }
    startCooldown(30);

    resendBtn.addEventListener('click', async () => {
        const email = document.getElementById('email').value;
        try {
            const response = await fetch('/resend-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            if (response.ok) {
                statusMsg.textContent = '✓ New OTP sent to your email!';
                statusMsg.className = 'status-msg status-success';
                statusMsg.style.display = 'block';
                startCooldown(60);
            } else {
                const data = await response.json();
                throw new Error(data.detail || 'Failed to resend OTP.');
            }
        } catch (err) {
            statusMsg.textContent = err.message;
            statusMsg.className = 'status-msg status-error';
            statusMsg.style.display = 'block';
        }
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const otp = document.getElementById('otp').value;
        const password = document.getElementById('password').value;

        statusMsg.style.display = 'none';
        statusMsg.className = 'status-msg';
        submitBtn.classList.add('loading');
        submitBtn.disabled = true;

        try {
            const response = await fetch('/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, otp, new_password: password })
            });

            const data = await response.json();

            if (response.ok) {
                statusMsg.textContent = '✓ Password reset successfully! Redirecting...';
                statusMsg.className = 'status-msg status-success';
                statusMsg.style.display = 'block';
                
                setTimeout(() => {
                    window.location.href = '/login?reset=true';
                }, 2000);
            } else {
                throw new Error(data.detail || 'Reset failed. Please check your OTP.');
            }
        } catch (err) {
            statusMsg.textContent = err.message;
            statusMsg.className = 'status-msg status-error';
            statusMsg.style.display = 'block';
            submitBtn.classList.remove('loading');
            submitBtn.disabled = false;
        }
    });
</script>

</body>
</html>
