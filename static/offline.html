<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a56db">
  <title>LEVIX | Offline</title>
  <style>
    :root {
      --brand: #1a56db;
      --text: #0f172a;
      --muted: #475569;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }
    .logo {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      margin: 0 auto 12px;
      font-weight: 800;
      color: #fff;
      background: var(--brand);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 1.2rem;
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
      font-size: 0.95rem;
    }
    .retry {
      margin-top: 16px;
      border: 0;
      min-height: 44px;
      padding: 0 16px;
      border-radius: 10px;
      background: var(--brand);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">LX</div>
    <h1>You are offline</h1>
    <p>LEVIX cannot reach the network right now. Reconnect and try again.</p>
    <button class="retry" type="button" onclick="window.location.reload()">Retry</button>
  </main>
</body>
</html>
